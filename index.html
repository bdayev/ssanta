<!DOCTYPE html>
<html lang="hy"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Գաղտնի Սանտա</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e4;--card:#fff;--ink:#2b1a14;--mut:#7a655b;--red:#c8102e;--grn:#165a43;--gold:#e8a317;--line:#e9d9bf}
@media (prefers-color-scheme:dark){:root{--bg:#0e2f25;--card:#14402f;--ink:#fdf3df;--mut:#b9cdbf;--red:#ff5a6e;--grn:#9be3c0;--gold:#ffc94d;--line:#25624a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Armenian","Segoe UI",Arial,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,7vw,40px);font-weight:900;margin:8px 0 4px;color:var(--red)}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:16px;margin:0 0 16px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--red);color:#fff}
button.g{background:var(--grn);color:#fff}
@media (prefers-color-scheme:dark){button.g{color:#0e2f25}}
button.o{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.x{padding:2px 10px;background:transparent;color:var(--red);font-size:18px}
button:disabled{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.code{font-size:34px;font-weight:900;letter-spacing:.18em;color:var(--grn)}
.pl{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.pl:last-child{border:0}
.msg{color:var(--red);font-weight:700;min-height:1.4em;margin:6px 0 0}
.reel{font-size:clamp(28px,8vw,44px);font-weight:900;text-align:center;padding:26px 8px;border-radius:16px;background:var(--bg);border:3px solid var(--gold);margin:12px 0;min-height:110px;display:flex;align-items:center;justify-content:center;word-break:break-word}
.reel.win{color:var(--red);animation:pop .5s}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.reel.win{animation:none}}
.link{background:none;color:var(--mut);padding:4px 0;text-decoration:underline;font-weight:400}
.gl{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
</style></head><body><main id="app"><h1>🎅 Գաղտնի Սանտա</h1><p class="sub">Բեռնվում է…</p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,collection,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,query,where,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ====== ՍԱ ՓՈԽԵՔ. Firebase Console → Project settings → Your apps → Web app ====== */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyBe3-kpWeuZYa8npkYfdePQE-ZPKUeG1gY",
  authDomain:"secret-santa-7b447.firebaseapp.com",
  projectId:"secret-santa-7b447",
  appId:"1:737408769473:web:05f7b33638b4d0eed3a340"
};
/* ================================================================================== */

const DOM='secret-santa.app'; // username -> username@secret-santa.app (միայն ներքին օգտագործման համար)
const fapp=initializeApp(FIREBASE_CONFIG),fs=getFirestore(fapp),auth=getAuth(fapp);
const snap=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
const lst2=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))});
const db={
  doc:p=>{const r=doc(fs,p);return{get:async()=>snap(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),onSnapshot:(n,e)=>onSnapshot(r,s=>n(snap(s)),e)}},
  collection:p=>{const c=collection(fs,p);const mk=q=>({where:(f,o,v)=>mk(query(c,where(f,o,v))),get:async()=>lst2(await getDocs(q)),onSnapshot:(n,e)=>onSnapshot(q,s=>n(lst2(s)),e)});return mk(c)}
};

const app=document.getElementById('app');
let uid=null,uname='',G=null,P=[],code=null,unG=null,unP=null,tk=null,phaseKey='';
const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x==='on')for(const y in a.on)e.addEventListener(y,a.on[y]);else if(x==='cls')e.className=a[x];else e[x]=a[x]}k.flat().forEach(c=>e.append(c));return e};
const pid=n=>encodeURIComponent(n.trim().toLowerCase().replace(/\s+/g,' ')).replace(/%/g,'~').replace(/[()!*']/g,'_').replace(/\./g,'~2E');
const cl=n=>n.trim().replace(/\s+/g,' ').slice(0,40);
function nextAt(hhmm){const [h,m]=hhmm.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);if(d.getTime()<=Date.now())d.setDate(d.getDate()+1);return d.getTime()}
const hm=ts=>new Date(ts).toLocaleTimeString('hy-AM',{hour:'2-digit',minute:'2-digit',hour12:false});
const hmv=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function seedRand(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pairs(){ // մեկ մեծ շրջան՝ ոչ ոք իրեն չի ստանում, ոչ ոք չի կրկնվում
  const ids=P.map(p=>p.id).sort(),r=seedRand((G.seed||'')+code);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  const m={};ids.forEach((x,i)=>m[x]=ids[(i+1)%ids.length]);return m}
const phase=()=>!G?'none':(G.closed||Date.now()>=G.deadline)?'closed':'open';
const isHost=()=>!!uid&&G&&G.hostId===uid;

function init(){
  if(FIREBASE_CONFIG.apiKey.startsWith('YOUR')){app.replaceChildren($('h1',{},'🎅 Գաղտնի Սանտա'),$('p',{cls:'msg'},'Նախ index.html-ում լրացրեք FIREBASE_CONFIG-ը (տես README.md)։'));return}
  let first=true;
  onAuthStateChanged(auth,u=>{uid=u?u.uid:null;uname=u?u.email.split('@')[0]:'';if(first){first=false;addEventListener('hashchange',route);route()}else if(!code)home()})}
function route(){const c=location.hash.slice(1).toUpperCase();c?openGame(c):home()}

function authCard(){
  const u=$('input',{placeholder:'Username',maxLength:30,autocomplete:'username'}),p=$('input',{type:'password',placeholder:'Password (առնվազն 6 նիշ)',autocomplete:'current-password'}),m=$('p',{cls:'msg'});
  const go=async reg=>{const n=u.value.trim().toLowerCase();
    if(!/^[a-z0-9_-]{3,30}$/.test(n)||p.value.length<6){m.textContent='Username՝ 3+ լատինական տառ/թիվ, password՝ առնվազն 6 նիշ';return}
    try{const f=reg?createUserWithEmailAndPassword:signInWithEmailAndPassword;await f(auth,n+'@'+DOM,p.value)}
    catch(e){const c=e.code||'';m.textContent=c.includes('already')?'Այս username-ը զբաղված է':(c.includes('credential')||c.includes('password')||c.includes('user-not-found'))?'Սխալ username կամ password':'Չհաջողվեց ('+c+')'}};
  return $('div',{cls:'card'},$('h2',{},'Հեղինակի մուտք'),$('p',{cls:'sub'},'Խաղ ստեղծելու համար մուտք գործիր կամ գրանցվիր։'),u,p,$('div',{cls:'row'},$('button',{on:{click:()=>go(false)}},'Մուտք'),$('button',{cls:'g',on:{click:()=>go(true)}},'Գրանցվել')),m)}

async function home(){
  stop();code=null;G=null;
  const msg=$('p',{cls:'msg'});
  const gn=$('input',{placeholder:'Խաղի անուն (օր.՝ Գրասենյակ 2026)',maxLength:50});
  const tm=$('input',{type:'time',value:'20:00'});
  const cn=$('input',{placeholder:'Սենյակի կոդ',maxLength:8,style:'text-transform:uppercase'});
  const mine=$('div');
  app.replaceChildren($('h1',{},'🎅 Գաղտնի Սանտա'),$('p',{cls:'sub'},'Ստեղծիր խաղ, կիսվիր կոդով, իսկ ժամը լրանալուց հետո ամեն մեկը կպտտի և կիմանա՝ ում է նվեր տալու։'),
   uid?'':authCard(),
   $('div',{cls:'card',hidden:!uid},$('h2',{},'Նոր խաղ (հեղինակ)'),gn,$('label',{},'Գրանցումը փակվում է ժամը՝ '),tm,
     $('button',{on:{click:async()=>{
       const name=cl(gn.value);if(!name){msg.textContent='Գրիր խաղի անունը';return}
       let c;for(let i=0;i<6;i++){c=Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');if(!(await db.doc('games/'+c).get()).exists)break}
       try{await db.doc('games/'+c).set({name,hostId:uid,hostName:uname,deadline:nextAt(tm.value||'20:00'),closed:false,seed:Math.random().toString(36).slice(2),createdAt:Date.now()});location.hash=c}catch(e){msg.textContent='Չհաջողվեց ստեղծել'}}}},'Ստեղծել խաղ')),
   $('div',{cls:'card'},$('h2',{},'Մտնել սենյակ'),cn,$('button',{cls:'g',on:{click:()=>{const c=cn.value.trim().toUpperCase();if(c)location.hash=c}}},'Մտնել')),
   msg,uid?$('div',{cls:'card'},$('h2',{},'Իմ խաղերը · '+uname),mine,$('button',{cls:'link',on:{click:()=>signOut(auth)}},'Դուրս գալ հաշվից')):'');
  if(!uid)return;
  try{const s=await db.collection('games').where('hostId','==',uid).get();
    const arr=s.docs.sort((a,b)=>(b.data().createdAt||0)-(a.data().createdAt||0));
    mine.replaceChildren(...(arr.length?arr.map(d=>$('div',{cls:'gl'},$('span',{},d.data().name+' · '+d.id),$('button',{cls:'o',on:{click:()=>{location.hash=d.id}}},'Բացել'))):[document.createTextNode('Դեռ խաղ չկա։')]))}
  catch(e){mine.textContent='Չհաջողվեց բեռնել'}}

function stop(){unG&&unG();unP&&unP();clearInterval(tk);unG=unP=null;phaseKey=''}
function openGame(c){
  stop();code=c;G=undefined;P=[];
  app.replaceChildren($('p',{cls:'sub'},'Բեռնվում է…'));
  unG=db.doc('games/'+c).onSnapshot(s=>{G=s.exists?s.data():null;draw()},()=>{G=null;draw()});
  unP=db.collection('games/'+c+'/players').onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,name:(d.data()||{}).name||d.id})).sort((a,b)=>a.name.localeCompare(b.name));draw()});
  tk=setInterval(()=>{if(G)draw()},1000)}

let hdr,lst,act;
function draw(){
  if(G===undefined)return;
  if(G===null){app.replaceChildren($('h1',{},'🎅 Գաղտնի Սանտա'),$('p',{cls:'sub'},'Այդպիսի սենյակ չկա։'),$('button',{on:{click:()=>{location.hash=''}}},'Գլխավոր էջ'));phaseKey='';return}
  const ph=phase(),key=ph+(isHost()?'h':'')+(ph==='closed'?P.length:'');
  if(!hdr||!hdr.isConnected||key!==phaseKey){phaseKey=key;build(ph)}
  fillHdr(ph);fillList(ph)}
function fillHdr(ph){
  const left=G.deadline-Date.now(),f=n=>String(n).padStart(2,'0');
  const t=ph==='open'?'Գրանցումը բաց է մինչև '+hm(G.deadline)+' (մնաց '+f(Math.floor(left/36e5))+':'+f(Math.floor(left/6e4)%60)+':'+f(Math.floor(left/1e3)%60)+')':'Գրանցումը փակ է՝ կարող եք պտտել։';
  hdr.querySelector('.t').textContent=t;hdr.querySelector('h2').textContent=G.name}
function fillList(ph){
  lst.replaceChildren($('h2',{},'Մասնակիցներ ('+P.length+')'),...(P.length?P.map(p=>$('div',{cls:'pl'},$('span',{},p.name),isHost()&&ph==='open'?$('button',{cls:'x',title:'Հեռացնել',on:{click:()=>db.doc('games/'+code+'/players/'+p.id).delete()}},'✕'):''))):[document.createTextNode('Դեռ ոչ ոք չկա։')]))}
function build(ph){
  const cp=$('button',{cls:'o',on:{click:()=>{const u=location.href.split('#')[0]+'#'+code;navigator.clipboard&&navigator.clipboard.writeText(u).then(()=>{cp.textContent='Պատճենվեց ✓'},()=>{})}}},'Պատճենել հղումը');
  hdr=$('div',{cls:'card'},$('h2'),$('div',{cls:'code'},code),$('p',{cls:'t sub'}),
    $('div',{cls:'row'},cp,$('button',{cls:'o',on:{click:()=>{location.hash=''}}},'← Գլխավոր')));
  lst=$('div',{cls:'card'});act=$('div');
  const msg=$('p',{cls:'msg'});
  if(ph==='open'){
    const nm=$('input',{placeholder:'Քո անունը',maxLength:40,value:lsGet('ss_name')});
    act.append($('div',{cls:'card'},$('h2',{},'Քո անունը'),nm,
      $('div',{cls:'row'},
       $('button',{cls:'g',on:{click:async()=>{const n=cl(nm.value);if(!n){msg.textContent='Գրիր անունդ';return}
         try{const r=db.doc('games/'+code+'/players/'+pid(n));if((await r.get()).exists){msg.textContent='Այս անունով մասնակից արդեն կա';return}
         if(phase()!=='open'){msg.textContent='Գրանցումը փակվել է';return}
         await r.set({name:n});lsSet('ss_name',n);msg.textContent='✓ Դու ցուցակում ես'}catch(e){msg.textContent='Չհաջողվեց (գրանցումը գուցե փակվել է)'}}}},'+ Մտնել'),
       $('button',{cls:'o',on:{click:async()=>{const n=cl(nm.value);if(!n)return;try{await db.doc('games/'+code+'/players/'+pid(n)).delete();msg.textContent='Դուրս եկար ցուցակից'}catch(e){msg.textContent='Չհաջողվեց'}}}},'— Դուրս գալ')),msg));
    if(isHost()){
      const an=$('input',{placeholder:'Ավելացնել մասնակից անունով',maxLength:40}),tm=$('input',{type:'time',value:hmv(G.deadline)}),hm2=$('p',{cls:'msg'});
      act.append($('div',{cls:'card'},$('h2',{},'Հեղինակի կառավարում'),an,
        $('button',{cls:'g',on:{click:async()=>{const n=cl(an.value);if(!n)return;await db.doc('games/'+code+'/players/'+pid(n)).set({name:n});an.value=''}}},'Ավելացնել'),
        $('p',{cls:'sub'},'Փակման ժամը՝'),tm,
        $('div',{cls:'row'},$('button',{cls:'o',on:{click:async()=>{await db.doc('games/'+code).update({deadline:nextAt(tm.value||'20:00')});hm2.textContent='Ժամը պահպանվեց'}}},'Պահպանել ժամը'),
        $('button',{on:{click:async()=>{if(P.length<3){hm2.textContent='Պետք է առնվազն 3 մասնակից';return}await db.doc('games/'+code).update({closed:true})}}},'Փակել հիմա')),hm2,
        $('button',{cls:'link',on:{click:async()=>{if(!confirm('Ջնջե՞լ խաղը'))return;for(const p of P)await db.doc('games/'+code+'/players/'+p.id).delete();await db.doc('games/'+code).delete();location.hash=''}}},'Ջնջել խաղը')))}
  }else{
    if(P.length<3){act.append($('div',{cls:'card'},$('p',{cls:'msg'},'Մասնակիցները քիչ են (պետք է առնվազն 3), խաղը չի կարող անցկացվել։')))}
    else{
      const sel=$('select',{},$('option',{value:''},'— ընտրիր քո անունը —'),...P.map(p=>$('option',{value:p.id},p.name)));
      const saved=lsGet('ss_name');const m=P.find(p=>p.id===pid(saved));if(m)sel.value=m.id;
      const reel=$('div',{cls:'reel'},'🎁'),btn=$('button',{on:{click:()=>spin(sel,reel,btn,msg)}},'Պտտել 🎡');
      act.append($('div',{cls:'card'},$('h2',{},'Ո՞վ ես դու'),sel,btn,reel,msg))}
  }
  app.replaceChildren($('h1',{},'🎅 Գաղտնի Սանտա'),hdr,act,lst)}
function spin(sel,reel,btn,msg){
  msg.textContent='';if(!sel.value){msg.textContent='Նախ ընտրիր քո անունը';return}
  const me=P.find(p=>p.id===sel.value),to=P.find(p=>p.id===pairs()[sel.value]);
  if(!me||!to){msg.textContent='Սխալ';return}
  lsSet('ss_name',me.name);btn.disabled=true;reel.classList.remove('win');
  const others=P.filter(p=>p.id!==me.id);let i=0;const N=26;
  (function step(){
    if(i>=N){reel.textContent='🎁 '+to.name;reel.classList.add('win');btn.disabled=false;btn.textContent='Տեսնել նորից';return}
    reel.textContent=others[Math.floor(Math.random()*others.length)].name;i++;setTimeout(step,45+i*i*0.7)})()}
init();
</script></body></html>
